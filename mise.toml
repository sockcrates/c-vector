[tools]
clang = "latest"
clang-format = "latest"

[tasks.test]
description = "Build and run the test suite"
run = "make test"

[tasks.lint]
description = "Compile all targets with Clang warnings treated as errors"
run = "make lint"

[tasks.format]
description = "Format C source and header files with clang-format"
run = "make format"

[tasks.format-check]
description = "Check C source and header files are formatted with clang-format"
run = "make format-check"

[tasks.bench]
description = "Build and run repeatable vector operation benchmarks"
run = "make bench"

[tasks.benchmark]
description = "Alias for bench"
run = "make benchmark"

[tasks.check]
description = "Run the required formatting, lint, and test gate"
depends = ["format-check", "lint", "test"]
