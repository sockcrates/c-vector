[plugins]
clang-tidy = "https://github.com/mise-plugins/mise-llvm.git"

[tools]
clang = "21.1.8"
clang-format = "21.1.8"
clang-tidy = "21.1.8"

[tasks.test]
description = "Build and run the test suite"
run = "make test"

[tasks.lint]
description = "Compile all targets with Clang warnings treated as errors"
run = "make lint"

[tasks.tidy]
description = "Enforce the SEI CERT C static-analysis policy with clang-tidy"
run = "make tidy"

[tasks.format]
description = "Format C source and header files with clang-format"
run = "make format"

[tasks.format-check]
description = "Check C source and header files are formatted with clang-format"
run = "make format-check"

[tasks.bench]
description = "Build and run repeatable vector operation benchmarks"
run = "make bench"

[tasks.benchmark]
description = "Alias for bench"
run = "make benchmark"

[tasks.check]
description = "Run the required formatting, CERT C analysis, lint, and test gate"
depends = ["format-check", "tidy", "lint", "test"]
